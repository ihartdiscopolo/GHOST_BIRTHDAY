<script>
  const startDate = new Date("2022-01-22T00:00:00");

  function updateTimeSinceDisplay() {
    const now = new Date();
    let diff = now - startDate;

    const years = now.getFullYear() - startDate.getFullYear();
    let anniversary = new Date(startDate);
    anniversary.setFullYear(startDate.getFullYear() + years);
    if (anniversary > now) {
      anniversary.setFullYear(anniversary.getFullYear() - 1);
    }

    let timeDiff = now - anniversary;
    let days = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
    timeDiff -= days * (1000 * 60 * 60 * 24);

    let hours = Math.floor(timeDiff / (1000 * 60 * 60));
    timeDiff -= hours * (1000 * 60 * 60);

    let minutes = Math.floor(timeDiff / (1000 * 60));
    timeDiff -= minutes * (1000 * 60);

    let seconds = Math.floor(timeDiff / 1000);

    document.getElementById("dreamy-time-counter").innerHTML =
      `${years} years, ${days} days, ${hours} hours, ${minutes} minutes, ${seconds} seconds`;
  }

  updateTimeSinceDisplay();
  setInterval(updateTimeSinceDisplay, 1000);
</script>
